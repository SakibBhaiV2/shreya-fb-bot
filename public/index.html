<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shreya — Test Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95, #831843);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .chat-box {
    width: 100%; max-width: 480px;
    height: 90vh; max-height: 720px;
    background: #0f0f1a;
    border-radius: 20px;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.08);
  }
  .header {
    padding: 14px 18px;
    background: linear-gradient(90deg, #7c3aed, #db2777);
    display: flex; align-items: center; gap: 12px; color: #fff;
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: #fff2; display: flex; align-items: center; justify-content: center;
    font-size: 20px; border: 2px solid rgba(255,255,255,.5);
  }
  .header .info { flex: 1; }
  .header h2 { font-size: 16px; font-weight: 600; }
  .header p { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; }
  .new-btn {
    background: rgba(255,255,255,.2);
    border: 1px solid rgba(255,255,255,.35);
    color: #fff;
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .new-btn:hover { background: rgba(255,255,255,.3); }

  .messages {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: pop .2s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.bot { align-self: flex-start; background: #1f1f2e; color: #e8e8f0; border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #7c3aed, #db2777); color: #fff; border-bottom-right-radius: 4px; }
  .msg.error { align-self: flex-start; background: #3a1010; color: #ffb4b4; border: 1px solid #661d1d; border-bottom-left-radius: 4px; font-size: 13px; }
  .msg a { color: #a78bfa; }

  .typing {
    align-self: flex-start; background: #1f1f2e;
    padding: 12px 16px; border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: flex; gap: 5px;
  }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #888; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-area {
    display: flex; gap: 8px; padding: 12px;
    background: #16161f; border-top: 1px solid rgba(255,255,255,.06);
  }
  .input-area input {
    flex: 1; background: #0f0f1a; border: 1px solid #2a2a3a;
    color: #fff; padding: 12px 16px; border-radius: 24px;
    font-size: 14.5px; outline: none;
    transition: .2s;
  }
  .input-area input:focus { border-color: #7c3aed; }
  .input-area button {
    width: 46px; height: 46px; border: none; border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #db2777);
    color: #fff; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: .2s;
  }
  .input-area button:hover:not(:disabled) { transform: scale(1.06); }
  .input-area button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
</style>
</head>
<body>

<div class="chat-box">
  <div class="header">
    <div class="avatar">💜</div>
    <div class="info">
      <h2>Shreya</h2>
      <p><span class="dot"></span> Online (Test Mode)</p>
    </div>
    <button class="new-btn" id="newChat" title="নতুন চ্যাট">+ New</button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input id="input" type="text" placeholder="মেসেজ লিখুন..." autocomplete="off" />
    <button id="send" type="button">➤</button>
  </div>
</div>

<script>
/* ================== Elements ================== */
const messagesEl = document.getElementById("messages");
const input      = document.getElementById("input");
const sendBtn    = document.getElementById("send");
const newBtn     = document.getElementById("newChat");

let sessionId = null;
let busy = false;

/* ================== UI Helpers ================== */
function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  const safe = String(text).replace(/</g, "&lt;");
  div.innerHTML = safe.replace(
    /(https?:\/\/[^\s]+)/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>'
  );
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const t = document.createElement("div");
  t.className = "typing"; t.id = "typing";
  t.innerHTML = "<span></span><span></span><span></span>";
  messagesEl.appendChild(t);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}
function clearMessages() { messagesEl.innerHTML = ""; }

/* ================== API ================== */
async function createSession() {
  const res = await fetch("/api/session", { method: "POST" });
  if (!res.ok) throw new Error("Could not create session");
  const data = await res.json();
  return data.sessionId;
}

async function loadHistory(id) {
  const res = await fetch("/api/history/" + encodeURIComponent(id));
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("Could not load history");
  const data = await res.json();
  return data.messages;
}

async function sendToServer(id, message) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sessionId: id, message }),
  });
  const raw = await res.text();
  let data;
  try { data = JSON.parse(raw); }
  catch { throw new Error("Bad response: " + raw); }
  if (!res.ok) throw new Error(data.detail || data.error || ("HTTP " + res.status));
  return data.reply;
}

/* ================== Init ================== */
async function init() {
  addMessage("হ্যালো! আমি শ্রেয়া 💜 কীভাবে সাহায্য করতে পারি?", "bot");

  sessionId = localStorage.getItem("sessionId");

  if (sessionId) {
    try {
      const history = await loadHistory(sessionId);
      if (history === null) {
        sessionId = null;
      } else if (history.length > 0) {
        clearMessages();
        history.forEach((m) =>
          addMessage(m.content, m.role === "user" ? "user" : "bot")
        );
      }
    } catch (e) {
      console.warn("history load failed:", e);
      sessionId = null;
    }
  }

  if (!sessionId) {
    try {
      sessionId = await createSession();
      localStorage.setItem("sessionId", sessionId);
    } catch (e) {
      console.error(e);
      addMessage("❌ সার্ভারের সাথে কানেক্ট করা যাচ্ছে না।", "error");
    }
  }

  input.focus();
}

/* ================== Actions ================== */
async function sendMessage() {
  if (busy) return;
  const text = input.value.trim();
  if (!text) return;

  if (!sessionId) {
    addMessage("❌ session নেই, পেজ রিলোড করুন।", "error");
    return;
  }

  busy = true;
  input.disabled = true;
  sendBtn.disabled = true;

  addMessage(text, "user");
  input.value = "";
  showTyping();

  try {
    const reply = await sendToServer(sessionId, text);
    hideTyping();
    addMessage(reply, "bot");
  } catch (err) {
    hideTyping();
    console.error(err);
    addMessage("❌ " + err.message, "error");
  } finally {
    busy = false;
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

async function newChat() {
  if (busy) return;

  if (sessionId) {
    // সার্ভার থেকে ডিলিট (তোমার server.js এ DELETE route নেই, তাই optional)
    try {
      await fetch("/api/session/" + encodeURIComponent(sessionId), {
        method: "DELETE",
      });
    } catch {}
  }

  localStorage.removeItem("sessionId");
  clearMessages();
  addMessage("নতুন চ্যাট শুরু হয়েছে 💜", "bot");

  try {
    sessionId = await createSession();
    localStorage.setItem("sessionId", sessionId);
  } catch (e) {
    addMessage("❌ সার্ভারে কানেক্ট করা যায়নি।", "error");
  }
  input.focus();
}

/* ================== Events ================== */
sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMessage();
  }
});
newBtn.addEventListener("click", newChat);

/* ================== Start ================== */
init();
</script>
</body>
</html>
